services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: chefai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chefai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chefai_password}
      POSTGRES_DB: ${POSTGRES_DB:-chefai_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - chefai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chefai_user} -d ${POSTGRES_DB:-chefai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chefai-network

  # ─── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chefai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chefai_user}:${POSTGRES_PASSWORD:-chefai_password}@db:5432/${POSTGRES_DB:-chefai_db}
      SECRET_KEY: ${SECRET_KEY:-chefai-super-secret-jwt-key-2024-please-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_NAME: ChefAI
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chefai-network

  # ─── React Frontend + Nginx Proxy ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chefai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - chefai-network

# ─── Volumes & Networks ──────────────────────────────────────────────────────
volumes:
  chefai_pgdata:
    driver: local

networks:
  chefai-network:
    driver: bridge
